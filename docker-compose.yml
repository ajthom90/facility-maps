# Local stack. For published images use:
#   image: ghcr.io/ajthom90/facility-maps:0.1.0
# (or :latest / :edge). On every app start: migrate → seed system presets → listen.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: facility
      POSTGRES_PASSWORD: facility
      POSTGRES_DB: facility_maps
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facility -d facility_maps"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Prefer building locally; override with a GHCR tag for production pulls:
    #   IMAGE_TAG=0.1.0 docker compose up -d
    # or set image: explicitly and remove build:.
    image: ${FACILITY_MAPS_IMAGE:-facility-maps:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://facility:facility@db:5432/facility_maps
      # Required: set a long random string in .env (no weak default; production rejects placeholders)
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env — see .env.example}
      # false for plain HTTP (default Compose). Set true when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-changeme}
      UPLOAD_DIR: /data/uploads
      # Relative to container WORKDIR /app (must match Dockerfile ENV)
      WEB_DIST: apps/web/dist
      # Baked into the image by default; override only for local debugging
      APP_VERSION: ${APP_VERSION:-0.1.0}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
