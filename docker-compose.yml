# Facility Safety Maps — single-container SQLite deploy.
#
# Portable volumes (copy these to move hosts):
#   facility-maps-data   → SQLite DB + floor-plan uploads  (/data)
#   facility-maps-config → app.env secrets & settings     (/config)
#
# First start: set SESSION_SECRET in a host .env (see .env.example).
# The app writes /config/app.env on first boot so later host moves only
# need the two volumes (+ this compose file / image tag).

name: facility-maps

services:
  app:
    image: ${FACILITY_MAPS_IMAGE:-facility-maps:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.3.1}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      # Data volume layout
      SQLITE_PATH: /data/db/facility-maps.sqlite
      UPLOAD_DIR: /data/uploads
      CONFIG_FILE: /config/app.env
      WEB_DIST: apps/web/dist
      APP_VERSION: ${APP_VERSION:-0.3.1}
      # Initial secrets (compose / host .env). Prefer values already in /config/app.env after first boot.
      # Required on first install (host .env). After first boot, /config/app.env holds it
      # so you can migrate hosts with only the data+config volumes.
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-changeme}
    volumes:
      # All mutable application data (DB + plans) — back this up
      - data:/data
      # Portable configuration (SESSION_SECRET, bootstrap, etc.)
      - config:/config
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  data:
    name: facility-maps-data
  config:
    name: facility-maps-config
