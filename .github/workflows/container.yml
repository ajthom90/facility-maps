name: Container

# Builds and publishes the public GHCR image.
# Tags:
#   - push to main → :edge and :sha-<short>
#   - git tag vX.Y.Z → :X.Y.Z, :X.Y, :X, :latest (and source APP_VERSION=X.Y.Z)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/ajthom90/facility-maps
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag or package.json
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(node -p "require('./package.json').version")
            # edge builds are pre-release of the current package version
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              VER="${VER}-edge.${GITHUB_SHA::7}"
            fi
          fi
          echo "app_version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best effort)
        # First publish may create a private package; try to flip to public.
        # Safe to fail if already public or org policy blocks it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PKG="facility-maps"
          # Container package name is the image repo name (lowercase)
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PKG}/visibility" \
            -f visibility=public \
            || gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER}/packages/container/${PKG}/visibility" \
            -f visibility=public \
            || true
