name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-session-secret-32chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check workspace versions match root
        run: npm run version:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
