name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: facility
          POSTGRES_PASSWORD: facility
          POSTGRES_DB: facility_maps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facility -d facility_maps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://facility:facility@localhost:5432/facility_maps
      SESSION_SECRET: ci-test-session-secret-32chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check workspace versions match root
        run: npm run version:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
